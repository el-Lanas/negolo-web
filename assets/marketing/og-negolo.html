<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>negolo · Open Graph</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:Nunito,system-ui,Arial,sans-serif;color:#fff;position:relative;
    background:
      radial-gradient(760px 520px at 88% 4%, rgba(232,184,75,.22), transparent 62%),
      radial-gradient(680px 460px at 4% 100%, rgba(232,184,75,.10), transparent 60%),
      #2D1B36}
  .frame{position:absolute;inset:34px;border:1px solid rgba(232,184,75,.28);border-radius:24px}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:64px 72px 56px}
  .logo{height:56px;width:auto}
  h1{font-size:72px;line-height:1.04;font-weight:900;letter-spacing:-.025em;max-width:19ch}
  h1 em{font-style:normal;color:#E8B84B}
  .sub{margin-top:24px;font-size:27px;font-weight:700;color:#C9BBD6}
  .sub b{color:#E8B84B;font-weight:900}
  .sub i{font-style:normal;color:#8E7F9A;font-weight:700;padding:0 6px}
  .foot{display:flex;align-items:center;gap:16px;font-size:24px;font-weight:800}
  .foot .dot{width:8px;height:8px;border-radius:50%;background:#E8B84B}
  .foot b{color:#E8B84B}
  .foot span{color:#EFE7F3}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <img class="logo" src="/assets/brand/logo-full-dark.svg" alt="negolo">
    <div>
      <h1>Tu negocio, <em>sin vueltas</em> en internet.</h1>
      <p class="sub">Webs, tiendas, apps y chatbots <i>·</i> Landings desde <b>S/299</b> <i>·</i> Sin pago previo</p>
    </div>
    <div class="foot"><span class="dot"></span><span><b>negolo.com</b> · WhatsApp 930 227 652</span></div>
  </div>
</body>
</html>
